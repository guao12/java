# ============================================================
#  生产环境 prod —— 端口 8082
#  账号密码建议通过环境变量注入，不要把明文写进仓库：
#    DB_URL / DB_USERNAME / DB_PASSWORD
# ============================================================
server.port=8082

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kr_build?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.pool-name=KrBuildProdHikariPool

logging.level.root=warn
logging.level.com.fenglin.springboottest=info
