<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>卡塞尔学院 · 守夜人社区</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet"></noscript>
<style>
/* Fonts loaded via <link> with fallback; no blocking @import */

:root {
  --bg-deepest: #080c16;
  --bg-dark: #0b101c;
  --bg-navy: #0e1525;
  --bg-card: rgba(12, 18, 32, 0.88);
  --gold: #c8a56a;
  --gold-light: #e2c998;
  --gold-dim: rgba(200, 165, 106, 0.35);
  --silver: #b8c2d4;
  --silver-bright: #dce2ee;
  --silver-dim: rgba(180, 195, 215, 0.5);
  --text-primary: #cdd4e2;
  --text-secondary: rgba(165, 180, 205, 0.72);
  --text-dim: rgba(120, 140, 170, 0.45);
  --border-subtle: rgba(130, 155, 200, 0.13);
  --border-glow: rgba(170, 195, 235, 0.22);
  --glow-blue: rgba(90, 130, 200, 0.25);
  --serif: 'Cinzel', 'Noto Serif SC', 'Georgia', serif;
  --serif-cn: 'Noto Serif SC', 'SimSun', serif;
  --serif-body: 'Cormorant Garamond', 'Noto Serif SC', serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-deepest);
  color: var(--text-primary);
  font-family: var(--serif-cn);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== LOADING ===== */
#loading-screen {
  position: fixed; inset: 0; z-index: 2000;
  background: var(--bg-deepest);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 1.5s ease, visibility 1.5s;
  /* CSS fallback: auto-fade after 3s even if JS fails */
  animation: loaderAutoHide 0.5s ease 3s forwards;
}
#loading-screen.hidden { opacity: 0; visibility: hidden; animation: none; }
@keyframes loaderAutoHide {
  to { opacity: 0; visibility: hidden; }
}

.loading-spinner {
  width: 48px; height: 48px;
  border: 1.5px solid rgba(130, 155, 200, 0.15);
  border-top-color: rgba(180, 200, 235, 0.5);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
.loading-label {
  margin-top: 20px;
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: var(--text-dim);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== FADE OVERLAY ===== */
#fade-overlay {
  position: fixed; inset: 0;
  background: var(--bg-deepest);
  z-index: 1500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}
#fade-overlay.visible { opacity: 1; pointer-events: all; }

/* ===== PAGE SYSTEM ===== */
.page {
  position: fixed; inset: 0;
  opacity: 0; visibility: hidden;
  transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  z-index: 10;
}
.page.active { opacity: 1; visibility: visible; z-index: 100; }

/* ===== PARTICLE CANVAS ===== */
#particle-canvas {
  position: fixed; inset: 0; z-index: 200;
  pointer-events: none;
}

/* ========================================
   PAGE 1: SPLASH / ENTRY
   ======================================== */
#splash-page {
  background: var(--bg-deepest);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
}

.splash-bg-glow {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 55% at 50% 38%, rgba(30, 45, 75, 0.45) 0%, transparent 65%),
    radial-gradient(ellipse 120% 100% at 50% 50%, transparent 30%, rgba(5, 8, 16, 0.7) 100%);
  pointer-events: none;
}

/* Stars / dust */
.splash-dust {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
}
.dust {
  position: absolute;
  background: rgba(170, 195, 235, 0.35);
  border-radius: 50%;
  animation: dustDrift linear infinite;
}
@keyframes dustDrift {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  15% { opacity: 0.8; }
  85% { opacity: 0.6; }
  100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
}

/* ---- EMBLEM ---- */
.emblem-wrap {
  position: relative;
  width: 200px; height: 200px;
  margin-bottom: 40px;
  animation: emblemFloat 7s ease-in-out infinite;
}
@keyframes emblemFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.emblem-glow {
  position: absolute; inset: -50px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(80, 120, 190, 0.18) 0%, rgba(60, 90, 150, 0.08) 40%, transparent 70%);
  animation: glowPulse 5s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.12); }
}

.emblem-img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  filter: brightness(0.85) contrast(1.1);
  position: relative; z-index: 2;
  background: radial-gradient(circle, #1a2540 0%, #0e1830 60%, #0a1020 100%);
  border: 1px solid rgba(150, 180, 225, 0.2);
}

/* Orbiting rings */
.orbit-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(150, 180, 225, 0.22);
  animation: orbit linear infinite;
}
.orbit-ring:nth-child(3) { inset: -18px; animation-duration: 18s; }
.orbit-ring:nth-child(4) { inset: -38px; animation-duration: 28s; animation-direction: reverse; opacity: 0.7; }
.orbit-ring:nth-child(5) { inset: -60px; animation-duration: 42s; opacity: 0.45; }

.orbit-ring .orbiter {
  position: absolute;
  width: 5px; height: 5px;
  background: rgba(185, 210, 245, 0.7);
  border-radius: 50%;
  top: -2.5px; left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 10px rgba(160, 195, 240, 0.5), 0 0 20px rgba(160, 195, 240, 0.2);
}

@keyframes orbit { to { transform: rotate(360deg); } }

/* Light sweep */
.emblem-sheen {
  position: absolute; inset: -20px;
  border-radius: 50%;
  overflow: hidden;
  z-index: 3; pointer-events: none;
}
.emblem-sheen::after {
  content: '';
  position: absolute;
  width: 50%; height: 300%;
  top: -100%; left: -60%;
  background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.06) 50%, transparent 58%);
  animation: sheenSweep 6s ease-in-out infinite;
}
@keyframes sheenSweep {
  0%, 100% { left: -60%; }
  50% { left: 110%; }
}

/* ---- TITLE ---- */
.splash-title {
  font-family: var(--serif);
  font-size: clamp(26px, 6.5vw, 40px);
  font-weight: 500;
  letter-spacing: 14px;
  color: var(--silver-bright);
  text-shadow: 0 0 40px rgba(150, 185, 235, 0.2), 0 2px 10px rgba(0,0,0,0.6);
  margin-bottom: 18px;
  opacity: 0; transform: translateY(24px);
  animation: fadeUp 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
}

/* Divider */
.splash-sep {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 44px;
  opacity: 0; transform: translateY(24px);
  animation: fadeUp 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
}
.splash-sep .rule {
  width: 70px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim) 30%, var(--gold-dim) 70%, transparent);
}
.splash-sep .gem {
  width: 5px; height: 5px;
  background: var(--gold);
  transform: rotate(45deg);
  box-shadow: 0 0 6px rgba(200, 165, 106, 0.4);
}
.splash-sep .phrase {
  font-family: var(--serif-cn);
  font-size: 15px;
  font-weight: 300;
  letter-spacing: 7px;
  color: var(--text-secondary);
  white-space: nowrap;
}

/* CTA */
.splash-btn {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 15px 44px;
  border: 1px solid var(--border-glow);
  border-radius: 50px;
  background: rgba(12, 18, 32, 0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--text-primary);
  font-family: var(--serif-cn);
  font-size: 15px;
  font-weight: 300;
  letter-spacing: 4px;
  cursor: pointer;
  overflow: hidden;
  opacity: 0; transform: translateY(24px);
  animation: fadeUp 1.4s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
  transition: all 0.4s;
}
.splash-btn:hover {
  border-color: rgba(200, 165, 106, 0.35);
  box-shadow: 0 0 40px rgba(90, 130, 200, 0.15), inset 0 0 40px rgba(90, 130, 200, 0.08);
}
.splash-btn .chev {
  font-size: 18px;
  transition: transform 0.3s;
  color: var(--text-secondary);
}
.splash-btn:hover .chev { transform: translateX(3px); }
.splash-btn::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: 50px;
  background: linear-gradient(135deg, rgba(200,165,106,0.1), transparent 50%, rgba(90,130,200,0.1));
  opacity: 0;
  transition: opacity 0.4s;
}
.splash-btn:hover::before { opacity: 1; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}
/* Alt keyframes: identical visuals, different name — guarantees animation restart via .re class */
@keyframes fadeUpAlt {
  to { opacity: 1; transform: translateY(0); }
}
.splash-title.re { animation: fadeUpAlt 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards; }
.splash-sep.re   { animation: fadeUpAlt 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards; }
.splash-btn.re   { animation: fadeUpAlt 1.4s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards; }

/* ========================================
   PAGE 2: STORY / PROLOGUE
   ======================================== */
#story-page {
  background: var(--bg-deepest);
}

.story-relief {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 62%;
  overflow: hidden;
  background: linear-gradient(180deg, #151e30 0%, #101828 50%, var(--bg-deepest) 100%);
}
.story-relief img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center top;
  filter: brightness(0.7) contrast(1.1);
}
.story-relief::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(8, 12, 22, 0.15) 0%,
    rgba(8, 12, 22, 0.3) 60%,
    rgba(8, 12, 22, 0.85) 90%,
    var(--bg-deepest) 100%
  );
}

.story-skip {
  position: absolute;
  top: 22px; right: 22px;
  padding: 9px 22px;
  background: rgba(10, 15, 28, 0.65);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border-subtle);
  border-radius: 24px;
  color: var(--text-secondary);
  font-family: var(--serif-cn);
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  z-index: 20;
  transition: all 0.3s;
}
.story-skip:hover {
  border-color: var(--gold-dim);
  color: var(--gold-light);
}

.story-progress {
  position: absolute;
  top: 62%; left: 50%; transform: translate(-50%, -50%);
  width: 82%; z-index: 15;
}
.story-progress-track {
  width: 100%; height: 1.5px;
  background: var(--border-subtle);
  border-radius: 2px;
  position: relative;
}
.story-progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--gold), var(--silver));
  border-radius: 2px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
.story-progress-orn {
  display: flex; justify-content: space-between;
  margin-top: -6px;
}
.story-progress-orn .d {
  width: 8px; height: 8px;
  border: 1px solid var(--gold-dim);
  transform: rotate(45deg);
  background: var(--bg-deepest);
}

.story-body {
  position: absolute;
  top: 66%; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px 32px 50px;
  text-align: left;
  z-index: 15;
}

.story-text {
  font-family: var(--serif-cn);
  font-size: clamp(15px, 3.8vw, 17px);
  font-weight: 400;
  line-height: 2.15;
  color: var(--text-primary);
  letter-spacing: 1.5px;
  max-width: 22em;
  min-height: 140px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  text-align: left;
}
.story-text .ch {
  display: inline-block;
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.story-text .ch.on { opacity: 1; transform: translateY(0); }

.story-next {
  margin-top: 28px;
  font-family: var(--serif-cn);
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  animation: gentlePulse 2.5s ease-in-out infinite;
}
.story-next .chv {
  display: inline-block;
  font-size: 18px;
  animation: chvNudge 1.8s ease-in-out infinite;
}
@keyframes gentlePulse {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}
@keyframes chvNudge {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(3px); }
}

/* ========================================
   PAGE 3: MAIN
   ======================================== */
#main-page {
  background: var(--bg-deepest);
}

.main-bg {
  position: fixed; inset: 0;
  z-index: 0;
  background: linear-gradient(180deg, #0e1830 0%, #142040 30%, #0e1830 60%, var(--bg-deepest) 100%);
}
.main-bg .bg-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center top;
  filter: brightness(0.55) contrast(1.15) saturate(0.9);
  opacity: 0;
  transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);
}
.main-bg .bg-img.on { opacity: 1; }
.main-bg::after {
  content: '';
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      rgba(8, 12, 22, 0.55) 0%,
      rgba(8, 12, 22, 0.25) 20%,
      rgba(8, 12, 22, 0.15) 45%,
      rgba(8, 12, 22, 0.4) 70%,
      rgba(8, 12, 22, 0.75) 100%);
}
/* 蛇岐八家页签：罩一层绯红色调，和卡塞尔的冷蓝区分 */
.main-bg.she::after {
  background:
    linear-gradient(180deg,
      rgba(24, 8, 12, 0.55) 0%,
      rgba(24, 8, 12, 0.25) 20%,
      rgba(24, 8, 12, 0.15) 45%,
      rgba(24, 8, 12, 0.4) 70%,
      rgba(24, 8, 12, 0.75) 100%);
}

.main-scroll {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* ---- NAV ---- */
.main-nav {
  display: flex; align-items: center;
  padding: 12px 16px;
  gap: 10px;
  position: sticky; top: 0;
  background: rgba(8, 12, 22, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 100;
  border-bottom: 1px solid rgba(130, 155, 200, 0.08);
}

.btn-back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px;
  border: 1px solid var(--border-subtle);
  border-radius: 24px;
  background: rgba(12, 18, 32, 0.5);
  color: var(--text-secondary);
  font-family: var(--serif);
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.3s;
  white-space: nowrap;
}
.btn-back:hover {
  border-color: var(--gold-dim);
  color: var(--gold-light);
}

.nav-pills {
  display: flex;
  flex: 1;
  background: rgba(12, 18, 32, 0.5);
  border: 1px solid var(--border-subtle);
  border-radius: 28px;
  overflow: hidden;
}
.nav-pill {
  flex: 1;
  padding: 9px 12px;
  text-align: center;
  font-family: var(--serif-cn);
  font-size: 13.5px;
  letter-spacing: 2px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.35s;
  position: relative;
  user-select: none;
}
.nav-pill.on {
  color: var(--silver-bright);
  background: rgba(22, 32, 55, 0.7);
}
.nav-pill.on::after {
  content: '';
  position: absolute;
  bottom: 1px; left: 25%; right: 25%;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(185, 210, 245, 0.5), transparent);
}

/* ---- HERO ---- */
.hero {
  display: flex; flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 32px 20px 10px;
  position: relative;
}

.hero-eyebrow {
  font-family: var(--serif);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--text-secondary);
  line-height: 1.9;
  align-self: flex-start;
  margin-left: 10px;
  text-align: left;
}

.lang-select {
  position: absolute;
  top: 24px; right: 20px;
  padding: 7px 14px;
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  background: rgba(12, 18, 32, 0.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  color: var(--text-secondary);
  font-family: var(--serif-cn);
  font-size: 13px;
  cursor: pointer;
}

.hero-title {
  font-family: var(--serif);
  font-size: clamp(34px, 8.5vw, 52px);
  font-weight: 600;
  letter-spacing: 12px;
  line-height: 1.3;
  color: var(--silver-bright);
  text-shadow: 0 0 50px rgba(150, 185, 235, 0.18), 0 4px 16px rgba(0,0,0,0.6);
  margin: 28px 0 16px;
}

.hero-sub {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 20px;
}
.hero-sub .star {
  font-size: 9px;
  color: var(--gold);
}
.hero-sub .txt {
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--text-secondary);
  text-transform: uppercase;
  line-height: 1.7;
}

/* ---- BULLETIN ---- */
.bulletin {
  margin: 16px 18px;
  padding: 22px 22px;
  background: rgba(10, 16, 30, 0.6);
  border: 1px solid rgba(130, 155, 200, 0.16);
  border-radius: 14px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.2);
}
.bulletin-tag {
  font-family: var(--serif);
  font-size: 10px;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.bulletin-h {
  font-family: var(--serif-cn);
  font-size: 19px;
  font-weight: 600;
  color: var(--silver-bright);
  letter-spacing: 3px;
  margin-bottom: 6px;
}
.bulletin-p {
  font-family: var(--serif-cn);
  font-size: 13px;
  color: var(--text-secondary);
  letter-spacing: 1px;
}

/* ---- TAGLINE ---- */
.main-tagline {
  text-align: center;
  font-family: var(--serif-cn);
  font-size: 15px;
  font-weight: 300;
  letter-spacing: 5px;
  color: var(--text-secondary);
  margin: 28px 0 20px;
}

/* ---- LOGIN CTA ---- */
.btn-login-main {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 18px;
  padding: 17px;
  border: 1px solid rgba(170, 195, 235, 0.25);
  border-radius: 12px;
  background: rgba(12, 18, 32, 0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--silver-bright);
  font-family: var(--serif-cn);
  font-size: 17px;
  letter-spacing: 8px;
  cursor: pointer;
  text-align: center;
  transition: all 0.35s;
  position: relative;
  overflow: hidden;
}
.btn-login-main:hover {
  border-color: rgba(200, 165, 106, 0.3);
  box-shadow: 0 0 35px rgba(90, 130, 200, 0.12);
  background: rgba(18, 28, 50, 0.65);
}
.btn-login-main .chv { margin-left: 4px; }

.reg-links {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin: 14px 18px 40px;
}
.reg-links a {
  font-family: var(--serif-cn);
  font-size: 13px;
  color: var(--text-secondary);
  text-decoration: none;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: color 0.3s;
}
.reg-links a:hover { color: var(--gold-light); }
.reg-links .dot {
  width: 3px; height: 3px;
  background: var(--text-dim);
  border-radius: 50%;
}

/* ========================================
   PAGE 4: LOGIN
   ======================================== */
#login-page {
  background: var(--bg-deepest);
}

.login-bg {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(180deg, #0c1428 0%, #101c34 40%, var(--bg-deepest) 100%);
}
.login-bg img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center top;
  filter: brightness(0.35) contrast(1.1) saturate(0.8);
}
.login-bg::after {
  content: '';
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg,
      rgba(8, 12, 22, 0.6) 0%,
      rgba(8, 12, 22, 0.4) 30%,
      rgba(8, 12, 22, 0.5) 60%,
      rgba(8, 12, 22, 0.8) 100%);
}

.login-wrap {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 16px 20px 40px;
}

.login-top {
  width: 100%; max-width: 420px;
}

.login-emblem {
  width: 72px; height: 72px;
  margin: 12px auto 14px;
}
.login-emblem img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  filter: brightness(0.85);
  background: radial-gradient(circle, #1a2540 0%, #0e1830 100%);
  border: 1px solid rgba(150, 180, 225, 0.15);
}

.login-brand {
  text-align: center;
  font-family: var(--serif);
  font-size: 13px;
  letter-spacing: 5px;
  color: var(--text-secondary);
  margin-bottom: 14px;
}

.login-h1 {
  text-align: center;
  font-family: var(--serif-cn);
  font-size: clamp(26px, 6.5vw, 36px);
  font-weight: 700;
  letter-spacing: 10px;
  color: var(--silver-bright);
  text-shadow: 0 0 30px rgba(155, 185, 235, 0.15);
  margin-bottom: 10px;
}

.login-desc {
  text-align: center;
  font-family: var(--serif-cn);
  font-size: 13.5px;
  color: var(--text-secondary);
  letter-spacing: 2px;
  margin-bottom: 28px;
}

.login-card {
  width: 100%; max-width: 420px;
  background: rgba(10, 16, 30, 0.65);
  border: 1px solid rgba(150, 180, 225, 0.22);
  border-radius: 20px;
  padding: 28px 22px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 0.5px rgba(150, 180, 225, 0.08);
}

.fld { margin-bottom: 18px; }
.fld-label {
  display: block;
  font-family: var(--serif-cn);
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.fld-wrap { position: relative; }
.fld-input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(6, 10, 20, 0.65);
  border: 1px solid rgba(130, 155, 200, 0.15);
  border-radius: 11px;
  color: var(--text-primary);
  font-family: var(--serif-cn);
  font-size: 14.5px;
  letter-spacing: 1px;
  outline: none;
  transition: all 0.3s;
}
.fld-input::placeholder { color: var(--text-dim); }
.fld-input:focus {
  border-color: var(--gold-dim);
  box-shadow: 0 0 20px rgba(90, 130, 200, 0.1);
}
.fld-eye {
  position: absolute;
  right: 13px; top: 50%; transform: translateY(-50%);
  background: none; border: none;
  color: var(--text-secondary);
  font-family: var(--serif-cn);
  font-size: 12.5px;
  cursor: pointer;
  letter-spacing: 1px;
}

.fld-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.chk-wrap {
  display: flex; align-items: center; gap: 7px;
}
.chk-wrap input {
  width: 17px; height: 17px;
  accent-color: #3a5a8c;
  cursor: pointer;
}
.chk-wrap label {
  font-family: var(--serif-cn);
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  letter-spacing: 1px;
}
.forgot {
  font-family: var(--serif-cn);
  font-size: 13px;
  color: var(--text-secondary);
  text-decoration: none;
  cursor: pointer;
}
.forgot:hover { color: var(--gold-light); }

.btn-submit {
  width: 100%;
  padding: 15px;
  border: 1px solid rgba(170, 195, 235, 0.25);
  border-radius: 12px;
  background: rgba(18, 28, 50, 0.5);
  color: var(--silver-bright);
  font-family: var(--serif-cn);
  font-size: 17px;
  letter-spacing: 7px;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-submit:hover {
  border-color: rgba(200, 165, 106, 0.3);
  background: rgba(22, 35, 60, 0.6);
  box-shadow: 0 0 30px rgba(90, 130, 200, 0.15);
}

.divider-row {
  display: flex; align-items: center;
  margin: 24px 0 16px;
}
.divider-row .ln {
  flex: 1; height: 1px;
  background: var(--border-subtle);
}
.divider-row .lbl {
  padding: 0 14px;
  font-family: var(--serif-cn);
  font-size: 12.5px;
  color: var(--text-dim);
  letter-spacing: 3px;
}

.btn-fresh {
  width: 100%;
  padding: 13px;
  border: 1px solid rgba(130, 155, 200, 0.18);
  border-radius: 12px;
  background: rgba(12, 18, 32, 0.35);
  color: var(--text-secondary);
  font-family: var(--serif-cn);
  font-size: 13.5px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-fresh:hover {
  border-color: var(--gold-dim);
  color: var(--gold-light);
}

/* ===== MUSIC BTN ===== */
.music-fab {
  position: fixed;
  bottom: 72px; right: 18px;
  width: 42px; height: 42px;
  border: 1px solid var(--border-glow);
  border-radius: 50%;
  background: rgba(12, 18, 32, 0.65);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 300;
  transition: all 0.3s;
}
.music-fab:hover {
  border-color: var(--gold-dim);
}
.music-fab.on { animation: musicGlow 2.5s ease-in-out infinite; }
@keyframes musicGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(90, 130, 200, 0.15); }
  50% { box-shadow: 0 0 0 10px rgba(90, 130, 200, 0); }
}
.music-fab svg {
  width: 18px; height: 18px;
  fill: var(--silver);
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 2px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-subtle); }

/* ===== MOBILE ===== */
@media (max-width: 420px) {
  .splash-title { letter-spacing: 8px; }
  .hero-title { letter-spacing: 7px; }
  .login-h1 { letter-spacing: 7px; }
  .splash-sep .phrase { letter-spacing: 4px; font-size: 13px; }
  .splash-btn { padding: 13px 32px; font-size: 14px; }
}

/* ========================================
   PC / DESKTOP（>=768px）
   移动端样式为基底，此处只做桌面增强：
   通栏吸顶导航 + 居中限宽内容列 + 双栏布局 + 放大排版
   ======================================== */
@media (min-width: 768px) {
  /* ---- 全局 ---- */
  ::-webkit-scrollbar { width: 4px; }

  /* ---- 首屏 ---- */
  .emblem-wrap { width: 240px; height: 240px; margin-bottom: 48px; }
  .splash-title { font-size: 56px; letter-spacing: 18px; }
  .splash-sep .rule { width: 110px; }
  .splash-sep .phrase { font-size: 16px; letter-spacing: 9px; }
  .splash-btn { padding: 17px 58px; font-size: 16px; letter-spacing: 5px; }

  /* ---- 序章 ---- */
  .story-relief { height: 56%; }
  /* 桌面视口宽，cover 裁剪后只露图片顶部一截；新浮雕龙身在图中部，下移取景框 */
  .story-relief img { object-position: center 38%; }
  .story-skip { top: 28px; right: 40px; }
  .story-progress { width: min(600px, 72%); }
  .story-body { top: 59%; padding: 24px 48px 64px; }
  .story-text { max-width: 38em; font-size: 17px; }
  .story-next { font-size: 15px; }

  /* ---- 主页：通栏导航 + 居中内容列 ---- */
  #main-page { display: flex; flex-direction: column; }
  .main-nav { flex: none; padding: 14px 48px; }
  .btn-back { font-size: 13px; padding: 9px 20px; }
  .nav-pills {
    position: absolute; left: 50%; transform: translateX(-50%);
    flex: 0 0 400px; max-width: 46vw;
  }
  .nav-pill { padding: 10px 12px; font-size: 14px; }

  .main-scroll {
    flex: 1; min-height: 0;
    max-width: 1080px; margin: 0 auto; padding: 0 48px;
  }

  .hero { padding: 72px 0 28px; }
  .hero-title { font-size: 72px; letter-spacing: 16px; margin: 36px 0 20px; }
  .hero-eyebrow { font-size: 11px; letter-spacing: 6px; margin-left: 2px; }
  .hero-sub .txt { font-size: 12px; letter-spacing: 5px; }
  .lang-select { top: 26px; right: 0; font-size: 13.5px; }

  /* 公告 + 登录入口双栏 */
  .main-grid {
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    gap: 24px;
    align-items: stretch;
    margin: 12px 0 56px;
  }

  .bulletin {
    margin: 0; padding: 32px 34px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .bulletin-tag { font-size: 11px; margin-bottom: 12px; }
  .bulletin-h { font-size: 22px; margin-bottom: 8px; }
  .bulletin-p { font-size: 14px; line-height: 1.9; }

  .main-cta {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 30px;
    background: rgba(10, 16, 30, 0.6);
    border: 1px solid rgba(130, 155, 200, 0.16);
    border-radius: 14px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
  }
  .main-tagline { font-size: 17px; letter-spacing: 6px; margin: 0 0 24px; }
  .btn-login-main { margin: 0; width: 100%; padding: 18px; }
  .reg-links { margin: 20px 0 0; }

  /* ---- 登录页：左品牌 + 右表单 ---- */
  .login-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 72px;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 48px;
  }
  .login-top { position: absolute; top: 26px; left: 48px; width: auto; max-width: none; }
  .login-intro { text-align: left; }
  .login-emblem { width: 96px; height: 96px; margin: 0 0 26px; }
  .login-brand { text-align: left; font-size: 14px; letter-spacing: 6px; margin-bottom: 18px; }
  .login-h1 { text-align: left; font-size: 46px; letter-spacing: 12px; margin-bottom: 14px; }
  .login-desc { text-align: left; font-size: 15px; letter-spacing: 2.5px; }
  .login-card { max-width: 460px; padding: 38px 36px; border-radius: 22px; }
  .fld-label { font-size: 13.5px; }
  .fld-input { padding: 15px 17px; font-size: 15px; }
  .btn-submit { padding: 16px; font-size: 17px; }
  .btn-fresh { padding: 14px; font-size: 14px; }

  /* ---- 音乐按钮 ---- */
  .music-fab { bottom: 34px; right: 34px; width: 46px; height: 46px; }
  .music-fab svg { width: 20px; height: 20px; }
}

/* ---- 大屏微调 ---- */
@media (min-width: 1200px) {
  .splash-title { font-size: 64px; }
  .hero-title { font-size: 84px; letter-spacing: 18px; }
  .main-scroll { max-width: 1160px; }
  .login-wrap { max-width: 1180px; }
}
</style>
</head>
<body>

<!-- Fade overlay -->
<div id="fade-overlay"></div>

<!-- Particle canvas -->
<canvas id="particle-canvas"></canvas>

<!-- ===== LOADING ===== -->
<div id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-label">Loading</div>
</div>

<!-- ========================================
     SPLASH PAGE
     ======================================== -->
<div class="page active" id="splash-page">
  <div class="splash-bg-glow"></div>
  <div class="splash-dust" id="splash-dust"></div>

  <!-- Emblem -->
  <div class="emblem-wrap">
    <div class="emblem-glow"></div>
    <img class="emblem-img" src="assets/A_circular_metallic_silver_sea_2026-11-06T01-19-40.png" alt="Cassell College Seal">
    <div class="orbit-ring"><div class="orbiter"></div></div>
    <div class="orbit-ring"><div class="orbiter"></div></div>
    <div class="orbit-ring"><div class="orbiter"></div></div>
    <div class="emblem-sheen"></div>

  <!-- Title -->
  <h1 class="splash-title">CASSELL COLLEGE</h1>

  <!-- Divider -->

  <!-- CTA -->

<!-- ========================================
     STORY PAGE
     ======================================== -->
<div class="page" id="story-page">
  <div class="story-relief">
    <img src="assets/Western_dragon_runic_stone_relief_2026-11-09T01-45-57.png" alt="Western Dragon Relief">
  </div>

  <button class="story-skip" onclick="goTo('main')">跳过序章</button>

  <div class="story-progress">
    <div class="story-progress-track">
      <div class="story-progress-fill" id="story-fill"></div>
    </div>
    <div class="story-progress-orn">
      <div class="d"></div>
      <div class="d"></div>
    </div>
  </div>

  <div class="story-body">
    <div class="story-text" id="story-text"></div>
    <div class="story-next" onclick="storyNext()">
      点击继续 <span class="chv">›</span>
    </div>

</div>

<!-- ========================================
     MAIN PAGE
     ======================================== -->
<div class="page" id="main-page">
  <div class="main-bg">
    <img class="bg-img bg-cassell on" src="assets/A_majestic_gothic_castle_at_ni_2026-11-06T01-18-23.png" alt="Cassell Castle">
    <img class="bg-img bg-she" src="assets/Dark_japanese_palace_torii_night_2026-11-09T01-41-58.png" alt="Takamagahara Palace">
  </div>

  <!-- Nav（PC 端为通栏吸顶栏；移动端与原来一致） -->
  <div class="main-nav">
    <button class="btn-back" onclick="goTo('splash')">← BACK</button>
    <div class="nav-pills">
      <div class="nav-pill on" onclick="pickTab(this)">卡塞尔学院</div>
      <div class="nav-pill" onclick="pickTab(this)">蛇岐八家</div>

  <div class="main-scroll">
    <!-- Hero -->
    <div class="hero">
      <div class="hero-eyebrow">NIGHT<br>WATCHERS<br>COMMUNITY</div>

      <h1 class="hero-title">CASSELL<br>COLLEGE</h1>
      <div class="hero-sub">
        <span class="star">✦</span>

    <div class="main-grid">
      <!-- Bulletin -->
      <div class="bulletin">
        <div class="bulletin-tag">Organization Bulletin</div>

        <!-- Login button -->

        </button>

        <!-- Register -->
        <div class="reg-links">
          <a onclick="goTo('login')">新生注册</a>
          <div class="dot"></div>

<!-- ========================================
     LOGIN PAGE
     ======================================== -->
<div class="page" id="login-page">
  <div class="login-bg">
    <img src="assets/A_majestic_gothic_castle_at_ni_2026-11-06T01-18-23.png" alt="Castle BG">
  </div>

  <div class="login-wrap">
    <div class="login-top">
      <button class="btn-back" onclick="goTo('main')">← BACK</button>
    </div>

    <div class="login-intro">
      <div class="login-emblem">
        <img src="assets/A_circular_metallic_silver_sea_2026-11-06T01-19-40.png" alt="Seal">
      </div>

      <div class="login-brand">CASSELL COLLEGE</div>

        <div class="lbl">新生入口</div>

<!-- Music FAB -->
<div class="music-fab" id="music-fab" onclick="toggleMusic()">
  <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
</div>

<script>
// ===================== NAVIGATION =====================
const PAGES = {};
['splash','story','main','login'].forEach(id => {
  PAGES[id] = document.getElementById(id + '-page');
});
let current = 'splash';

function goTo(name) {
  const ov = document.getElementById('fade-overlay');
  if (ov) ov.classList.add('visible');

  setTimeout(() => {
    try {
      // Hide all pages safely
      ['splash','story','main','login'].forEach(id => {
        const el = PAGES[id];
        if (el) el.classList.remove('active');
      });
      // Show target page
      const target = PAGES[name];
      if (target) {
        target.classList.add('active');
        target.scrollTop = 0;
      }
      current = name;
      if (name === 'splash') restartAnims();
      if (name === 'story') initStory();
    } catch (e) { console.warn('goTo error:', e); }

    // ALWAYS hide overlay, even if error occurred
    if (ov) setTimeout(() => ov.classList.remove('visible'), 60);
  }, 500);
}

function restartAnims() {
  const root = PAGES.splash;
  if (!root) return;
  root.querySelectorAll('.splash-title, .splash-sep, .splash-btn').forEach(el => {
    if (!el) return;
    el.classList.remove('re');
    void el.offsetWidth; // force reflow
    el.classList.add('re');
  });
}

// ===================== INIT =====================
// Splash page is already .active in HTML; CSS entrance animations play naturally.
// Do NOT call restartAnims here — the none→'' trick permanently kills animations.
setTimeout(() => {
  const ls = document.getElementById('loading-screen');
  if (ls) ls.classList.add('hidden');
}, 1500);

// Also handle late image loads gracefully
window.addEventListener('error', (e) => {
  if (e.target && e.target.tagName === 'IMG') {
    e.target.style.display = 'none';
  }
}, true);

// ===================== STORY =====================
const STORY = [
  '在人类文明出现之前，龙族已经建立高度发达的文明。黑王尼德霍格位于整个龙族血统和权力结构的顶点，既是创造者，也是绝对皇帝。龙族以血统维持秩序，低阶龙类必须服从高阶龙类；黑王对所有龙类拥有近乎绝对的统治权。',
  '当青铜与火之王的权柄触及大地，龙族的辉煌时代降临。它们建造了超越想象的城市，掌握了元素与炼金的极致之力。',
  '然而辉煌之下暗流涌动。白王的背叛点燃了龙族内战的烈焰，曾经辉煌的文明在战火中崩塌，龙族的时代走向终结。',
  '在废墟之中，人类文明悄然崛起。但龙族从未真正消亡——它们以另一种方式潜伏在历史的暗处，等待着再次觉醒的时刻。',
  '卡塞尔学院，便是人类对抗龙族的最前线。这里培养着拥有"言灵"之力的精英战士，他们是守夜人，是黑暗中的最后防线。',
];
let sIdx = 0;

function initStory() {
  sIdx = 0;
  renderStory();
  const fill = document.getElementById('story-fill');
  if (fill) fill.style.width = (1 / STORY.length * 100) + '%';
}

function renderStory() {
  const el = document.getElementById('story-text');
  if (!el) return;
  el.innerHTML = '';
  const txt = STORY[sIdx];
  for (let i = 0; i < txt.length; i++) {
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = txt[i];
    el.appendChild(s);
    setTimeout(() => s.classList.add('on'), i * 25);
  }
  document.getElementById('story-fill').style.width =
    ((sIdx + 1) / STORY.length * 100) + '%';
}

function storyNext() {
  sIdx++;
  if (sIdx >= STORY.length) { goTo('main'); return; }
  renderStory();
}

// ===================== TABS =====================
function pickTab(el) {
  document.querySelectorAll('.nav-pill').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  // 主页背景跟随页签切换：卡塞尔学院 = 哥特城堡（冷蓝），蛇岐八家 = 高天原神殿（绯红）
  const isShe = el.textContent.indexOf('蛇岐八家') !== -1;
  const bg = document.querySelector('.main-bg');
  if (bg) bg.classList.toggle('she', isShe);
  document.querySelectorAll('.main-bg .bg-img').forEach(img => img.classList.remove('on'));
  const target = document.querySelector(isShe ? '.bg-she' : '.bg-cassell');
  if (target) target.classList.add('on');
}

// ===================== PASSWORD =====================
function togglePwd() {
  const inp = document.getElementById('pwd');
  if (!inp) return;
  const btn = inp.nextElementSibling;
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '隐藏'; }
  else { inp.type = 'password'; btn.textContent = '显示'; }
}

// ===================== MUSIC =====================
let musicOn = false;
function toggleMusic() {
  musicOn = !musicOn;
  const fab = document.getElementById('music-fab');
  if (fab) fab.classList.toggle('on', musicOn);
}

// ===================== PARTICLES =====================
const cv = document.getElementById('particle-canvas');
const cx = cv.getContext('2d');
let dust = [];

function sizeCv() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', sizeCv);
sizeCv();

class Dust {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * cv.width;
    this.y = init ? Math.random() * cv.height : cv.height + 5;
    this.r = Math.random() * 1.8 + 0.4;
    this.vy = -(Math.random() * 0.35 + 0.1);
    this.vx = (Math.random() - 0.5) * 0.18;
    this.a = Math.random() * 0.35 + 0.08;
    this.da = Math.random() * 0.001 + 0.0004;
  }
  step() {
    this.x += this.vx; this.y += this.vy; this.a -= this.da;
    if (this.a <= 0 || this.y < -5) this.reset(false);
  }
  draw() {
    cx.beginPath();
    cx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    cx.fillStyle = `rgba(165,195,235,${this.a})`;
    cx.fill();
  }
}

for (let i = 0; i < 45; i++) dust.push(new Dust());

(function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  dust.forEach(d => { d.step(); d.draw(); });
  requestAnimationFrame(loop);
})();

// ===================== SPLASH DUST (DOM) =====================
(function buildDust() {
  const box = document.getElementById('splash-dust');
  if (!box) return;
  for (let i = 0; i < 18; i++) {
    const d = document.createElement('div');
    d.className = 'dust';
    d.style.left = Math.random() * 100 + '%';
    d.style.top = Math.random() * 100 + '%';
    d.style.animationDuration = (12 + Math.random() * 18) + 's';
    d.style.animationDelay = -(Math.random() * 20) + 's';
    d.style.width = d.style.height = (1.5 + Math.random() * 2.5) + 'px';
    box.appendChild(d);
  }
})();

// ===================== KEYBOARD =====================
addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (current === 'splash') goTo('story');
    else if (current === 'story') storyNext();
  }
  if (e.key === 'Escape') {
    if (current === 'login') goTo('main');
    else if (current === 'main') goTo('splash');
    else if (current === 'story') goTo('main');
  }
});
</script>
