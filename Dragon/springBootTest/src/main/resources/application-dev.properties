# ============================================================
#  开发环境 dev —— 端口 8082
#  本地 MySQL：192.168.68.1:3306，root / 123456，库 dragon_raja（先执行 sql/dragon_raja.sql）
#  注意：MySQL 默认只建了 root@localhost，用 192.168.68.1 连接需要同 IP 的账号，
#        已执行 CREATE USER 'root'@'192.168.68.1' 并授权；换机器时别忘了这一步，
#        否则启动就报 Host 'xxx' is not allowed to connect。
# ============================================================
server.port=8082

# ---------------- 数据源（HikariCP，MyBatis-Plus starter 自带） ----------------
# 账号口令不要写死在仓库里：优先取环境变量，未设置时才用本机默认值（仅限本地开发）。
# 正式部署请设置 DR_DB_URL / DR_DB_USER / DR_DB_PASSWORD。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DR_DB_URL:jdbc:mysql://192.168.68.1:3306/dragon_raja?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
spring.datasource.username=${DR_DB_USER:root}
spring.datasource.password=${DR_DB_PASSWORD:123456}

# 连接池
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=DragonRajaHikariPool

# 开发期把 MyBatis-Plus 执行的 SQL 打到控制台，方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ---------------- JWT 密钥兜底（仅 dev 生效） ----------------
# 主配置里 dr.jwt.secret=${DR_JWT_SECRET} 在“未设置环境变量”时会启动失败。
# 下面这行让 dev 环境在未设置 DR_JWT_SECRET 时，复用 .run-secret 里的同一把密钥，
# 这样在 IDEA 直接点 Run（或 java -jar）也能启动成功。
# 优先级：环境变量 DR_JWT_SECRET > 本兜底值。prod 环境请通过环境变量注入真实密钥，不要依赖此值。
dr.jwt.secret=${DR_JWT_SECRET:qIGgHT5EjUPbrOiRHVSArkF5+5u2p8R9hshNGZfYYpTZO0ErVS8L+9aJMaHh5CUv}

# ---------------- 重置验证龙文下发通道 ----------------
# true  = 验证码随 /api/auth/reset/send 的响应直接返回（前端展示给用户照填），本地演示用；
# false = 验证码只写日志（生产默认，需自行接入短信 / 邮件）。
# 注意：该开关只影响本地演示，prod 环境下即使配 true 也会被强制关闭。
dr.auth.reset-code-echo=true

# ---------------- 跨域来源（多电脑共用同一套后端时用） ----------------
# 默认只放开 localhost / 127.0.0.1。若让其它电脑的前端直连本机后端
# （VITE_API_BASE=http://<本机IP>:8082），需要把局域网网段一并放开，
# 否则浏览器的预检请求（如 PUT /api/friend/read）会被拦掉。
# 走 Vite 代理（前端 5177 → /api 转发）时不经过跨域，无需改这里。
# 2026-11-09：前后端地址统一改成 192.168.68.1，该 IP 显式列在最前面
# （192.168.* 通配本来也覆盖它，写死是为了以后排查跨域时一眼能看到本机 IP）。
dr.cors.allowed-origin-patterns=http://192.168.68.1:[*],http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*],http://172.16.*:[*],http://172.17.*:[*],http://172.18.*:[*],http://172.19.*:[*],http://172.2*.*:[*],http://172.30.*:[*],http://172.31.*:[*]
