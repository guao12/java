# ============================================================
#  开发环境 dev —— 端口 8082
#  本地 MySQL：127.0.0.1:3306，root / 口令见 application-local.properties，库 dragon_raja（先执行 sql/dragon_raja.sql）
#
#  2026-11-16：默认地址由 192.168.68.1 改回 127.0.0.1。
#  原因：192.168.68.1 就是本机的以太网 IP，从它连本机 MySQL 时，MySQL 会做反解
#        把客户端认成主机名 VOIPC4，而库里只有 root@localhost 账号（历史上那条
#        CREATE USER 'root'@'192.168.68.1' 已经不在了），于是启动直接失败：
#        Host 'VOIPC4' is not allowed to connect to this MySQL server。
#        走 127.0.0.1 会命中 root@localhost，本地开发最稳。
#  若要恢复用局域网 IP 连接（例如库改到另一台机器），需要在那台 MySQL 上补授权：
#        CREATE USER 'root'@'192.168.68.1' IDENTIFIED BY '<本机口令>';
#        GRANT ALL PRIVILEGES ON dragon_raja.* TO 'root'@'192.168.68.1';
#        FLUSH PRIVILEGES;
#  后端仍然监听 0.0.0.0:8082，前端走 192.168.68.1:8082 访问不受影响。
# ============================================================
server.port=8082

# ---------------- 数据源（HikariCP，MyBatis-Plus starter 自带） ----------------
# 账号口令不要写死在仓库里：优先取环境变量，未设置时才用本机默认值（仅限本地开发）。
# 正式部署请设置 DR_DB_URL / DR_DB_USER / DR_DB_PASSWORD。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DR_DB_URL:jdbc:mysql://127.0.0.1:3306/dragon_raja?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
spring.datasource.username=${DR_DB_USER:root}
# 口令取值优先级：环境变量 DR_DB_PASSWORD > application-local.properties 的 dr.db.password。
# 注意不能写成 ${DR_DB_PASSWORD:}：空默认值会解析成空串，而本文件（profile 配置）的
# 优先级高于 spring.config.import 进来的 application-local.properties，于是 local 里的
# 口令会被这个空串盖掉，启动直接 Access denied (using password: NO)。
spring.datasource.password=${DR_DB_PASSWORD:${dr.db.password:}}

# 连接池
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=DragonRajaHikariPool

# 开发期把 MyBatis-Plus 执行的 SQL 打到控制台，方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ---------------- JWT 密钥兜底（仅 dev 生效） ----------------
# 主配置里 dr.jwt.secret=${DR_JWT_SECRET} 在“未设置环境变量”时会启动失败。
# 2026-11-16：原来写死的兜底密钥已移出仓库，改由 application-local.properties 提供
# （该文件不入库）。IDEA 直接点 Run 仍能启动，密钥却不再进 git。
# 优先级：环境变量 DR_JWT_SECRET > application-local.properties；prod 必须走环境变量。
# 兜底密钥已移出仓库：由环境变量 DR_JWT_SECRET 或 application-local.properties 提供。
dr.jwt.secret=${DR_JWT_SECRET:}

# ---------------- 重置验证龙文下发通道 ----------------
# true  = 验证码随 /api/auth/reset/send 的响应直接返回（前端展示给用户照填），本地演示用；
# false = 验证码只写日志（生产默认，需自行接入短信 / 邮件）。
# 注意：该开关只影响本地演示，prod 环境下即使配 true 也会被强制关闭。
dr.auth.reset-code-echo=true

# ---------------- 跨域来源（多电脑共用同一套后端时用） ----------------
# 默认只放开 localhost / 127.0.0.1。若让其它电脑的前端直连本机后端
# （VITE_API_BASE=http://<本机IP>:8082），需要把局域网网段一并放开，
# 否则浏览器的预检请求（如 PUT /api/friend/read）会被拦掉。
# 走 Vite 代理（前端 5177 → /api 转发）时不经过跨域，无需改这里。
# 2026-11-09：前后端地址统一改成 192.168.68.1，该 IP 显式列在最前面
# （192.168.* 通配本来也覆盖它，写死是为了以后排查跨域时一眼能看到本机 IP）。
dr.cors.allowed-origin-patterns=http://192.168.68.1:[*],http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*],http://172.16.*:[*],http://172.17.*:[*],http://172.18.*:[*],http://172.19.*:[*],http://172.2*.*:[*],http://172.30.*:[*],http://172.31.*:[*]
