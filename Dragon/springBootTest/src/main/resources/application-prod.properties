# ============================================================
#  生产环境 prod —— 端口 8082
#  账号密码建议通过环境变量注入，不要把明文写进仓库：
#    DB_URL / DB_USERNAME / DB_PASSWORD / DR_JWT_SECRET
#  库地址默认走 192.168.68.1（与 dev 保持一致），真实部署请用 DB_URL 覆盖。
# ============================================================
server.port=8082

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://192.168.68.1:3306/dragon_raja?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.pool-name=DragonRajaProdHikariPool

logging.level.root=warn
logging.level.com.fenglin.springboottest=info
