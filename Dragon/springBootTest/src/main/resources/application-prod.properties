# ============================================================
#  生产环境 prod —— 端口 8082
#  账号密码建议通过环境变量注入，不要把明文写进仓库：
#    DB_URL / DB_USERNAME / DB_PASSWORD / DR_JWT_SECRET
#  库地址默认走 127.0.0.1（与 dev 保持一致），真实部署请用 DB_URL 覆盖。
#  2026-11-16：由 192.168.68.1 改为 127.0.0.1 —— 那本来就是本机以太网 IP，
#  用它连本机 MySQL 会被反解成主机名 VOIPC4，而库上只有 root@localhost，
#  启动直接报 Host 'VOIPC4' is not allowed to connect。
# ============================================================
server.port=8082

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/dragon_raja?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
# 生产口令无默认值：未设置 DB_PASSWORD 时启动直接失败（快速失败优于静默使用弱口令）
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.pool-name=DragonRajaProdHikariPool

logging.level.root=warn
logging.level.com.fenglin.springboottest=info
