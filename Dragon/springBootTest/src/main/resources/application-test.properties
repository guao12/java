# ============================================================
#  测试环境 test —— 端口 8080
#  使用独立的测试库 dragon_raja_test，避免污染开发数据
# ============================================================
#  ⚠️ 当前状态：未启用（2026-11-06 核对）
#
#  1) 默认 profile 是 dev（见 application.properties），这个文件不会被加载；
#  2) 本机 MySQL 里 **不存在** dragon_raja_test 库 —— 之前只靠
#     sql/dragon_raja_archive.sql 尾部建 5 张空表，那段已于 2026-11-06 移除，
#     因为它会凭空造出一个缺 dr_user / dr_board 等表的半成品库；
#  3) src/test 下目前只有一个 contextLoads，走的是 dev profile。
#
#  要真正启用测试库，别只跑 archive 脚本，直接重建一套完整的：
#     mysql -uroot -p123456 -e "CREATE DATABASE dragon_raja_test CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
#     mysql -uroot -p123456 dragon_raja_test < sql/dragon_raja.sql   # 需先去脚本头部的 USE/库名改掉
#  或者改用 H2 / Testcontainers，别让测试碰真实 MySQL。
# ============================================================
