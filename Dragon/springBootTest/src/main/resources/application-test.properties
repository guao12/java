# ============================================================
#  测试环境 test —— 端口 8080
#  使用独立的测试库 dragon_raja_test，避免污染开发数据
# ============================================================
#  2026-11-16 核对后的状态：
#
#  1) 默认 profile 是 dev（见 application.properties），这个文件默认不加载；
#  2) dragon_raja_test 库已在本机 MySQL 建好，并由 sql/dragon_raja.sql 完整导入
#     （该 dump 不含 CREATE DATABASE / USE，表是 DROP + CREATE，可直接灌进空库）：
#         mysql -uroot -p -e "CREATE DATABASE IF NOT EXISTS dragon_raja_test
#           CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
#         mysql -uroot -p dragon_raja_test < sql/dragon_raja.sql
#     注意：dump 里带的是开发库数据快照，重灌会把测试库里改过的数据覆盖掉。
#  3) 库地址统一走 127.0.0.1：走 192.168.68.1 会被 MySQL 反解成主机名 VOIPC4，
#     而库里只有 root@localhost 账号，直接报 Host 'VOIPC4' is not allowed to connect。
#  4) src/test 下的 contextLoads 目前仍走 dev profile。
# ============================================================
server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/dragon_raja_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${DR_DB_USER:root}
# 口令：环境变量 DR_DB_PASSWORD 优先，其次 application-local.properties 的 dr.db.password
# （不能写成 ${DR_DB_PASSWORD:}，空默认会盖掉 local 里的口令，见 application-dev.properties 注释）
spring.datasource.password=${DR_DB_PASSWORD:${dr.db.password:}}
