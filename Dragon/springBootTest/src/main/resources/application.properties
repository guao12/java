# ============================================================
#  springBootTest - 卡塞尔学院 · 龙族身份认证系统（主配置）
#  对接前端：DragonRaja-Vue（Vue 3 + Vite，代理 /api -> 127.0.0.1:8082）
# ============================================================
spring.application.name=springBootTest

# 激活的环境：dev(8082) / test(8080) / prod(8082)   # 注意 dev 与 prod 端口相同，本地跑 prod 需先改端口
spring.profiles.active=dev

# UTF-8 编码，避免中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# ---------------- 跨域 ----------------
# 允许的来源（逗号分隔，支持 [*] 端口通配）。局域网部署时改成实际 IP，例如：
# dr.cors.allowed-origin-patterns=http://192.168.1.100:[*]
dr.cors.allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*]

# ---------------- JWT ----------------
# HS256 密钥，至少 32 字节。必须由环境变量 DR_JWT_SECRET 注入，禁止在仓库中写死默认值！
# 本地开发临时设置：set DR_JWT_SECRET=thm7UN7wr0iZNiyheEnkbtVBxUKh36cnEF9wWylnS14NiGfdIeND5854yRQOSBBL
# （上面只是示例，请自行生成；原仓库硬编码的那串密钥已视为泄露，正式环境必须更换）
dr.jwt.secret=${DR_JWT_SECRET}
# 短令牌：12 小时
dr.jwt.expire-seconds=43200
# 长令牌（"记住身份卡"勾选时）：7 天
dr.jwt.expire-seconds-remember=604800

# ---------------- 重置验证龙文下发通道 ----------------
# true  = 验证码随响应直接返回，等价于"谁都能重置别人的密钥"，只允许本地演示环境打开；
# false = 验证码只写日志（生产默认，需自行接入短信 / 邮件真正送达）。
# prod 环境下该开关会被代码强制关闭，配置成 true 也不会生效。
dr.auth.reset-code-echo=false

# ---------------- 日志 ----------------
logging.level.root=info
logging.level.com.fenglin.springboottest=debug
logging.level.com.fenglin.springboottest.mapper=info
logging.file.name=log/springBootTest.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36}.%M %L : %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36}.%M %L : %m%n

# ---------------- MyBatis-Plus ----------------
# 实体所在包，开启后无需在每个实体上写 @TableName（这里仍保留显式注解，便于阅读）
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
# XML 映射文件位置（本项目主要用注解与 Wrapper，保留位置方便后续扩展）
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
# 主键策略：ASSIGN_ID = 雪花ID，AUTO = 数据库自增（本项目用自增）
mybatis-plus.global-config.db-config.id-type=auto
# 开启驼峰转换：数据库 create_time -> 实体 createTime
mybatis-plus.global-config.db-config.table-underline=true
mybatis-plus.global-config.db-config.map-underscore-to-camel-case=true
# 逻辑删除配置：deleted 字段，1=已删除 0=未删除
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# 更新策略：not_null = 只更新非 null 字段，避免把库里的值覆盖成 null
mybatis-plus.global-config.db-config.update-strategy=not_null

# ---------------- 启动时自动补表（幂等） ----------------
# dr_user_clearance 必须存在，否则 /api/user/clearance 直接 500，权限进度就存不下来。
# 这张表原先只写在手工脚本 sql/dragon_raja_clearance.sql 里（该脚本已移除，
# 内容与本目录 db/clearance-schema.sql 一致），换电脑初始化数据库时极易漏掉，
# 所以这里随启动补一次：脚本里只有 CREATE TABLE IF NOT EXISTS，不会动既有数据。
#
# 论坛四张表（dr_board / dr_thread / dr_reply / dr_thread_action）同理：
# 换电脑只跑了 sql/dragon_raja.sql 就会漏掉，一进 /forum 直接 500。
#
# 种子数据用 INSERT IGNORE + 固定主键，每次启动执行也只会灌一次，
# 不会覆盖用户自己发的帖子。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/clearance-schema.sql,classpath:db/forum-schema.sql,classpath:db/report-schema.sql
spring.sql.init.data-locations=classpath:db/forum-seed.sql
spring.sql.init.encoding=UTF-8
# 建表失败（例如数据库账号没有 DDL 权限）只记日志，不阻断启动
spring.sql.init.continue-on-error=true

