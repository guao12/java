# ============================================================
#  springBootTest - 卡塞尔学院 · 龙族身份认证系统（主配置）
#  对接前端：DragonRaja-Vue（Vue 3 + Vite，代理 /api -> 127.0.0.1:8082）
# ============================================================
spring.application.name=springBootTest

# 激活的环境：dev(8082) / test(8080) / prod(8082)   # 注意 dev 与 prod 端口相同，本地跑 prod 需先改端口
spring.profiles.active=dev

# UTF-8 编码，避免中文乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# ---------------- JWT ----------------
# HS256 密钥，至少 32 字节；生产环境务必通过环境变量 DR_JWT_SECRET 注入
dr.jwt.secret=${DR_JWT_SECRET:a3o2HtkkMskiytphjUSpeiYoj2DI74tZhpdGyv-TrRjhuWm_5Nh-vqW5vqlbe7k4}
# 短令牌：12 小时
dr.jwt.expire-seconds=43200
# 长令牌（"记住身份卡"勾选时）：7 天
dr.jwt.expire-seconds-remember=604800

# ---------------- 日志 ----------------
logging.level.root=info
logging.level.com.fenglin.springboottest=debug
logging.level.com.fenglin.springboottest.mapper=debug
logging.file.name=log/springBootTest.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36}.%M %L : %m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36}.%M %L : %m%n

# ---------------- MyBatis-Plus ----------------
# 实体所在包，开启后无需在每个实体上写 @TableName（这里仍保留显式注解，便于阅读）
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
# XML 映射文件位置（本项目主要用注解与 Wrapper，保留位置方便后续扩展）
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
# 主键策略：ASSIGN_ID = 雪花ID，AUTO = 数据库自增（本项目用自增）
mybatis-plus.global-config.db-config.id-type=auto
# 开启驼峰转换：数据库 create_time -> 实体 createTime
mybatis-plus.global-config.db-config.table-underline=true
mybatis-plus.global-config.db-config.map-underscore-to-camel-case=true
# 逻辑删除配置：deleted 字段，1=已删除 0=未删除
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# 更新策略：not_null = 只更新非 null 字段，避免把库里的值覆盖成 null
mybatis-plus.global-config.db-config.update-strategy=not_null
